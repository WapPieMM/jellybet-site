<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff3f7"><meta name="description" content="Account พร้อมขายและติดผ่อน — jellybet"><title>Account ♡ jellybet</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>
(() => {
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const revealSelector = [
    '.hero', '.moodboard', '.portfolio-drive-card', '.account-entry-card',
    '.section-block', '.notice-card', '.accounts-page-heading',
    '.accounts-page-intro', '.account-status-filters', '.account-grid',
    '.account-card', '.account-page-main > .eyebrow', '.account-detail-card'
  ].join(',');

  function initScrollReveal() {
    if (reduceMotion || !('IntersectionObserver' in window)) return;
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -5% 0px' });

    const prepare = node => {
      if (!node || node.nodeType !== 1) return;
      if (node.matches(revealSelector) && !node.classList.contains('dream-reveal')) {
        node.classList.add('dream-reveal');
        observer.observe(node);
      }
      node.querySelectorAll(revealSelector).forEach(element => {
        if (element.classList.contains('dream-reveal')) return;
        element.classList.add('dream-reveal');
        observer.observe(element);
      });
    };

    document.documentElement.classList.add('dream-motion-ready');
    prepare(document.body);
    const mutationObserver = new MutationObserver(records => {
      records.forEach(record => record.addedNodes.forEach(prepare));
    });
    mutationObserver.observe(document.body, { childList: true, subtree: true });
  }

  function initHeroParallax() {
    if (reduceMotion || !window.matchMedia || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    const hero = document.querySelector('.hero');
    if (!hero) return;
    let frame = 0;
    hero.addEventListener('pointermove', event => {
      if (frame) cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        const bounds = hero.getBoundingClientRect();
        const x = ((event.clientX - bounds.left) / Math.max(bounds.width, 1) - 0.5) * 2;
        const y = ((event.clientY - bounds.top) / Math.max(bounds.height, 1) - 0.5) * 2;
        hero.querySelectorAll('.hero-float,.hero-flower').forEach((element, index) => {
          const depth = 2 + (index % 3) * 2;
          element.style.setProperty('--hero-pointer-x', (x * depth).toFixed(1) + 'px');
          element.style.setProperty('--hero-pointer-y', (y * depth).toFixed(1) + 'px');
        });
      });
    }, { passive: true });
    hero.addEventListener('pointerleave', () => {
      hero.querySelectorAll('.hero-float,.hero-flower').forEach(element => {
        element.style.setProperty('--hero-pointer-x', '0px');
        element.style.setProperty('--hero-pointer-y', '0px');
      });
    }, { passive: true });
  }

  function init() {
    initScrollReveal();
    initHeroParallax();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
  else init();
})();

</script><script defer src="/accounts-page.js"></script></head><body><div class="page-shell"><header class="topbar"><a class="brand" href="/" aria-label="กลับหน้าแรก"><span class="brand-name" id="accountsShopName">jellybet</span><span class="brand-heart">♡</span></a><a class="account-menu-link" href="/">หน้าแรก</a></header><main class="accounts-page-main"><div class="accounts-page-heading"><div><p class="eyebrow">LITTLE TREASURES ♡</p><h1>Account Marketplace</h1></div><span class="soft-tag" id="accountCount">กำลังโหลด…</span></div><p class="accounts-page-intro">เลือกดูไอดีตามสถานะที่ต้องการ แล้วกดดูเพิ่มเติมเพื่ออ่านรายละเอียดได้เลยค่ะ ♡</p><nav class="account-status-filters" aria-label="กรองสถานะ Account"><button type="button" class="account-filter is-active" data-status-filter="available" aria-pressed="true">พร้อมขาย <span id="countAvailable">0</span></button><button type="button" class="account-filter" data-status-filter="installment" aria-pressed="false">ติดผ่อน <span id="countInstallment">0</span></button><button type="button" class="account-filter" data-status-filter="sold" aria-pressed="false">ขายแล้ว <span id="countSold">0</span></button></nav><div class="account-grid accounts-page-grid" id="accountGrid"><div class="empty-state card"><span>୨୧</span><p>กำลังโหลดรายการ Account…</p><small>รอสักครู่นะคะ</small></div></div></main></div></body></html>
